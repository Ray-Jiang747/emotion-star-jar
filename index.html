<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101638"><link rel="manifest" href="manifest.webmanifest"><title>情绪星星瓶</title>
<style>
:root{--night:#080d28;--panel:rgba(32,39,84,.74);--line:rgba(229,206,255,.24);--text:#fff5ff;--muted:#b8bddc;--pink:#ff77b6;--gold:#ffd86b;--blue:#8bd7ff;--purple:#b491ff;--mint:#a8f0dc}*{box-sizing:border-box}html{background:var(--night);color-scheme:dark}body{min-height:100vh;margin:0;color:var(--text);font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif;background:radial-gradient(circle at 50% 18%,#25245d 0,transparent 34%),radial-gradient(circle at 12% 58%,rgba(66,73,176,.34),transparent 28%),linear-gradient(165deg,#081127,#11163b 52%,#11194a);overflow-x:hidden}button,input,textarea{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #fff3aa;outline-offset:3px}[hidden]{display:none!important}.sky{position:fixed;inset:0;pointer-events:none;overflow:hidden}.sky:before,.sky:after{content:"";position:absolute;inset:0;background-image:radial-gradient(circle,#fff 0 1px,transparent 1.5px),radial-gradient(circle,#ffb7da 0 1.5px,transparent 2px);background-size:87px 103px,151px 137px;background-position:12px 8px,54px 31px;opacity:.5;mask-image:linear-gradient(#000,transparent 90%)}.sky:after{animation:twinkle 4s ease-in-out infinite alternate}.shoot{position:absolute;width:85px;height:1px;background:linear-gradient(90deg,#fff,transparent);transform:rotate(-34deg);box-shadow:0 0 8px #ffb5e1;animation:shoot 8s linear infinite}.shoot.one{top:11%;left:33%}.shoot.two{top:4%;right:21%;animation-delay:4s}.app{position:relative;z-index:1;width:min(1460px,calc(100% - 36px));margin:auto;padding:24px 0 40px}.header{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}.brand{display:flex;align-items:center;gap:15px}.kitty-avatar{width:74px;height:62px;overflow:hidden;border-radius:45%;background:#fff;filter:drop-shadow(0 0 12px rgba(255,139,205,.55))}.kitty-avatar img{width:270px;transform:translate(-7px,-2px)}h1{margin:0;font-size:clamp(1.8rem,3vw,3rem);letter-spacing:.08em;background:linear-gradient(#fff,#f8aadd);-webkit-background-clip:text;color:transparent}.tagline{margin:3px 0 0;color:#c5cbe8}.tip{max-width:340px;padding:14px 18px;border:1px solid var(--line);border-radius:22px;background:linear-gradient(135deg,rgba(75,61,133,.62),rgba(29,36,81,.64))}.tip strong{display:block;color:#ffe3a5}.tip p{margin:4px 0 0;color:#d5d8ee;font-size:.9rem}.workspace{display:grid;grid-template-columns:minmax(290px,.86fr) minmax(400px,1.36fr) minmax(310px,.9fr);gap:22px}.panel{position:relative;border:1px solid var(--line);border-radius:28px;background:linear-gradient(145deg,rgba(52,57,115,.68),rgba(17,24,63,.78));box-shadow:inset 0 1px rgba(255,255,255,.14),0 22px 45px rgba(0,0,0,.24);backdrop-filter:blur(16px)}.side,.resolve{padding:23px}.step{display:flex;align-items:center;gap:10px;margin:0 0 13px;font-size:1.16rem}.step-num{display:grid;place-items:center;width:31px;height:31px;border-radius:50%;color:#37234c;font-weight:900;background:linear-gradient(145deg,#ffc4e8,#ff7fb4);box-shadow:0 0 16px rgba(255,115,179,.42)}label{display:block;margin:12px 0 7px;color:#e9e6f7;font-size:.9rem}.text-input,textarea{width:100%;border:1px solid rgba(226,213,255,.22);border-radius:16px;color:#fff;background:rgba(6,10,38,.42);padding:12px 14px;box-shadow:inset 0 3px 10px rgba(0,0,0,.18)}textarea{min-height:105px;resize:vertical}.counter{text-align:right;color:var(--muted);font-size:.75rem}.range-row{display:flex;align-items:center;gap:10px}.range-row input{width:100%;accent-color:var(--pink)}.range-value{min-width:42px;color:var(--gold);font-weight:800}.colors{display:flex;gap:11px}.color-dot{position:relative;width:31px;height:31px;border-radius:50%;border:2px solid transparent;background:var(--dot);box-shadow:inset 0 4px 7px rgba(255,255,255,.35),0 4px 10px rgba(0,0,0,.25)}.color-dot input{position:absolute;opacity:0}.color-dot:has(input:checked){border-color:white;transform:scale(1.12);box-shadow:0 0 15px var(--dot)}.fold-demo{display:flex;align-items:center;justify-content:center;gap:10px;margin:18px 0;color:#ff92c4;font-size:1.4rem}.paper,.folded{width:43px;height:43px;background:linear-gradient(135deg,#ffabd0,#d958a7);box-shadow:inset 0 0 0 1px rgba(255,255,255,.4)}.folded{clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 94%,50% 72%,20% 94%,31% 57%,2% 35%,39% 35%)}.primary{width:100%;min-height:55px;border:0;border-radius:999px;color:white;font-weight:900;background:linear-gradient(100deg,#c839a6,#ff669f 58%,#ffb75d);box-shadow:0 10px 22px rgba(211,57,146,.35),inset 0 2px rgba(255,255,255,.32);transition:.2s}.primary:hover{transform:translateY(-3px);filter:brightness(1.12)}
.bottle-panel{min-height:715px;padding:20px 18px 13px;display:flex;flex-direction:column;align-items:center;background:radial-gradient(circle at 50% 39%,rgba(104,91,190,.22),transparent 48%)}.bottle-scene{position:relative;width:min(100%,520px);height:630px}.cork{position:absolute;z-index:5;left:34%;top:2%;width:32%;height:68px;border-radius:45% 45% 13px 13px;background:radial-gradient(circle at 25% 40%,#7f4d31 0 1px,transparent 2px),linear-gradient(#dda774,#955638);background-size:15px 14px,auto;box-shadow:inset 0 7px 8px rgba(255,224,180,.35),0 9px 16px rgba(0,0,0,.32)}.neck{position:absolute;z-index:3;left:30%;top:10%;width:40%;height:114px;border:7px solid rgba(240,216,255,.7);border-radius:24px;background:linear-gradient(90deg,rgba(255,255,255,.24),rgba(255,126,193,.3),rgba(255,255,255,.2));box-shadow:inset 0 0 20px rgba(255,255,255,.35),0 0 16px rgba(255,109,185,.25)}.ribbon{position:absolute;z-index:6;left:27%;top:16%;width:46%;height:57px;border:4px solid rgba(255,202,227,.75);border-radius:15px;background:linear-gradient(#ff9bc4,#c83a9c);box-shadow:inset 0 7px 8px rgba(255,255,255,.25),0 5px 14px rgba(77,18,91,.38)}.bottle{position:absolute;z-index:2;left:10%;bottom:2%;width:80%;height:75%;padding:34% 8% 7%;overflow:hidden;border:8px solid rgba(226,210,255,.68);border-radius:37% 37% 22% 22%/20% 20% 12% 12%;background:linear-gradient(106deg,rgba(255,255,255,.28),rgba(162,106,210,.13) 25%,rgba(255,101,181,.14) 68%,rgba(255,255,255,.25));box-shadow:inset 17px 0 26px rgba(255,255,255,.25),inset -20px -17px 32px rgba(93,40,147,.28),inset 0 -25px 35px rgba(255,91,169,.13),0 0 34px rgba(222,123,255,.33)}.bottle:after{content:"";position:absolute;left:11%;top:17%;width:12px;height:56%;border-radius:99px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.82),transparent);transform:rotate(5deg)}.stars{position:relative;z-index:4;display:flex;flex-wrap:wrap-reverse;align-content:flex-end;justify-content:center;height:100%}.star{--size:clamp(43px,4vw,61px);position:relative;width:var(--size);height:var(--size);margin:-4px 1px;border:0;background:conic-gradient(from 18deg,color-mix(in srgb,var(--c) 66%,white),var(--c) 30%,color-mix(in srgb,var(--c) 66%,#664a92) 56%,color-mix(in srgb,var(--c) 86%,white) 78%,var(--c));clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 94%,50% 72%,20% 94%,31% 57%,2% 35%,39% 35%);filter:drop-shadow(0 5px 4px rgba(0,0,0,.34));transition:.25s;animation:float 4.6s ease-in-out infinite}.star:before{content:"• ᴗ •";position:absolute;left:0;right:0;top:38%;color:#62425e;font-size:calc(var(--size)*.2);font-weight:900;text-align:center;white-space:nowrap}.star:hover{z-index:10;transform:translateY(-10px) scale(1.14) rotate(7deg)}.empty{position:absolute;inset:55% 0 auto;text-align:center;color:var(--muted)}.bottle-count{margin:-1px 0;color:#ddd9f2}.bottle-count strong{color:var(--gold);font-size:2.2rem;text-shadow:0 0 14px rgba(255,214,93,.45)}
.selected{min-height:85px;margin:13px 0 18px;padding:13px;border:1px solid rgba(255,170,220,.25);border-radius:17px;background:linear-gradient(100deg,rgba(255,89,168,.22),rgba(255,255,255,.05))}.selected-title{font-weight:800}.meta{color:var(--muted);font-size:.8rem}.resolve textarea{min-height:118px}.dust-demo{display:flex;align-items:center;justify-content:center;gap:20px;margin-top:20px;color:#ffc3df}.dust{font-size:2rem;animation:twinkle 1.4s infinite alternate}.kitty-corner{position:absolute;right:18px;bottom:12px;width:88px;height:95px;overflow:hidden}.kitty-corner img{width:230px;transform:translate(-118px,-25px)}.records{margin-top:22px;padding:18px 20px}.records-head{display:flex;align-items:center;justify-content:space-between}.records h2{margin:0}.record-list{margin-top:12px;display:grid;gap:7px}.record{display:grid;grid-template-columns:1.2fr .7fr .55fr 1.7fr;gap:14px;align-items:center;padding:10px 12px;border-radius:13px;background:rgba(255,255,255,.045);font-size:.87rem}.status-pill{color:#72efb3}.status-pill.pending{color:#ffbb68}.record-empty{padding:24px;text-align:center;color:var(--muted)}.toast{position:fixed;z-index:30;left:50%;bottom:28px;transform:translate(-50%,30px);padding:11px 20px;border:1px solid rgba(255,255,255,.3);border-radius:999px;background:rgba(24,28,71,.92);opacity:0;transition:.25s}.toast.show{opacity:1;transform:translate(-50%,0)}
@keyframes twinkle{to{opacity:.18}}@keyframes shoot{0%{opacity:0;transform:translate(0,0) rotate(-34deg)}10%{opacity:1}25%,100%{opacity:0;transform:translate(220px,140px) rotate(-34deg)}}@keyframes float{50%{translate:0 -6px;rotate:3deg}}@keyframes enter{0%{opacity:0;transform:translateY(-170px) scale(.4) rotate(180deg)}70%{transform:translateY(8px) scale(1.12)}100%{transform:none}}@keyframes dissolve{to{opacity:0;transform:translateY(-95px) scale(.15) rotate(110deg);filter:blur(6px)}}.star.enter{animation:enter .72s cubic-bezier(.2,.8,.2,1),float 4.6s .8s infinite}.star.leave{animation:dissolve .65s forwards}@media(max-width:1050px){.workspace{grid-template-columns:1fr 1.2fr}.resolve{grid-column:1/-1}.record{grid-template-columns:1fr .65fr}.record span:nth-child(2),.record span:nth-child(4){display:none}}@media(max-width:720px){.app{width:min(100% - 20px,520px)}.tip{display:none}.kitty-avatar{width:56px;height:50px}.workspace{display:flex;flex-direction:column}.bottle-panel{order:-1;min-height:570px}.bottle-scene{height:500px}.side,.resolve{padding:18px}.record{grid-template-columns:1fr auto}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style></head><body><div class="sky"><i class="shoot one"></i><i class="shoot two"></i></div><div class="app">
<header class="header"><div class="brand"><div class="kitty-avatar"><img src="assets/hello-kitty.png" alt="Hello Kitty"></div><div><h1>情绪星星瓶 ♥</h1><p class="tagline">把生气折成星星，装进瓶子里</p></div></div><aside class="tip"><strong>💡 小贴士</strong><p>生气是正常的情绪，重要的是学会面对和解决它。你比自己想象的更强大！</p></aside></header>
<div class="workspace"><section class="panel side"><h2 class="step"><span class="step-num">1</span>写下生气的原因</h2><form id="star-form"><label for="title">事件标题</label><input id="title" class="text-input" maxlength="36" placeholder="例如：和朋友吵架"><label for="reason">为什么生气？</label><textarea id="reason" maxlength="100" placeholder="把这件事轻轻写下来……"></textarea><div id="counter" class="counter">0/100</div><label for="intensity">情绪强度</label><div class="range-row"><span>轻</span><input id="intensity" type="range" min="0" max="100" value="60"><output id="intensity-value" class="range-value">60</output></div><label>选择情绪颜色</label><div class="colors"><label class="color-dot" style="--dot:var(--pink)"><input type="radio" name="color" value="pink" checked></label><label class="color-dot" style="--dot:var(--gold)"><input type="radio" name="color" value="yellow"></label><label class="color-dot" style="--dot:var(--blue)"><input type="radio" name="color" value="blue"></label><label class="color-dot" style="--dot:var(--purple)"><input type="radio" name="color" value="purple"></label></div><h2 class="step" style="margin-top:21px"><span class="step-num">2</span>折成星星放进瓶子</h2><div class="fold-demo"><i class="paper"></i><b>→</b><i class="folded"></i></div><button class="primary" type="submit">⭐ 折好了，放进瓶子</button></form></section>
<section class="panel bottle-panel"><div class="bottle-scene"><div class="cork"></div><div class="neck"></div><div class="ribbon"></div><div class="bottle"><div id="stars" class="stars"></div><p id="empty" class="empty">瓶子还空着<br>等一颗星星来陪你</p></div></div><p class="bottle-count">瓶子里有 <strong id="count">0</strong> 颗星星</p></section>
<section class="panel resolve"><h2 class="step"><span class="step-num" style="background:linear-gradient(145deg,#bbffe8,#72dfc1)">3</span>解决问题，消除星星</h2><p class="tagline">点击瓶中的星星，记录你是怎么解决的</p><div class="selected"><div id="selected-title" class="selected-title">还没有选择星星</div><div id="selected-meta" class="meta">轻点瓶中任意一颗星星</div></div><label for="solution">我是这样解决的：</label><textarea id="solution" placeholder="写下沟通、行动或心态上的改变……"></textarea><button id="resolve-button" class="primary" type="button">消除这颗星星 ✨</button><div class="dust-demo"><span>⭐</span><b>→</b><span class="dust">· ✦ · ✧</span></div><div class="kitty-corner"><img src="assets/hello-kitty.png" alt="陪伴你的 Hello Kitty"></div></section></div>
<section class="panel records"><div class="records-head"><h2>📒 最近记录</h2><span class="meta">每一次面对情绪，都是在变得更好的路上</span></div><div id="record-list" class="record-list"></div></section></div><div id="toast" class="toast" role="status" aria-live="polite"></div>
<script>
(()=>{const KEY='emotion-star-jar:v1',colors=['pink','yellow','blue','purple'];let entries=[],selectedId=null,enteringId=null;const $=s=>document.querySelector(s),e={form:$('#star-form'),title:$('#title'),reason:$('#reason'),counter:$('#counter'),intensity:$('#intensity'),intensityValue:$('#intensity-value'),stars:$('#stars'),empty:$('#empty'),count:$('#count'),selectedTitle:$('#selected-title'),selectedMeta:$('#selected-meta'),solution:$('#solution'),resolve:$('#resolve-button'),records:$('#record-list'),toast:$('#toast')};const uid=()=>crypto.randomUUID?.()||`${Date.now()}-${Math.random().toString(16).slice(2)}`,date=v=>new Intl.DateTimeFormat('zh-CN',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}).format(new Date(v));function norm(x){return{id:String(x.id||uid()),title:typeof x.title==='string'?x.title:'',reason:String(x.reason||''),intensity:Number.isFinite(Number(x.intensity))?Number(x.intensity):60,color:colors.includes(x.color)?x.color:'pink',status:x.status==='resolved'?'resolved':'pending',createdAt:x.createdAt||new Date().toISOString(),solution:typeof x.solution==='string'?x.solution:'',resolvedAt:x.resolvedAt||null}}function load(){try{const raw=JSON.parse(localStorage.getItem(KEY)||'[]');entries=Array.isArray(raw)?raw.filter(x=>x&&x.reason).map(norm):[]}catch{entries=[];note('旧记录读取失败，已从空瓶开始')}}function save(){try{localStorage.setItem(KEY,JSON.stringify(entries));return true}catch{note('这台设备暂时无法保存记录');return false}}function note(t){e.toast.textContent=t;e.toast.classList.add('show');clearTimeout(note.t);note.t=setTimeout(()=>e.toast.classList.remove('show'),2200)}function star(x){const b=document.createElement('button');b.type='button';b.className=`star${x.id===enteringId?' enter':''}`;b.style.setProperty('--c',`var(--${x.color==='yellow'?'gold':x.color})`);b.title=x.title||x.reason;b.setAttribute('aria-label',`查看星星：${x.title||x.reason}`);b.onclick=()=>select(x.id);return b}function render(){const pending=entries.filter(x=>x.status==='pending'),recent=[...entries].sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt)).slice(0,6);e.stars.replaceChildren(...pending.map(star));e.empty.hidden=!!pending.length;e.count.textContent=pending.length;e.records.replaceChildren();if(!recent.length){const p=document.createElement('p');p.className='record-empty';p.textContent='折下第一颗星星后，成长记录会出现在这里。';e.records.append(p)}else recent.forEach(x=>{const row=document.createElement('div');row.className='record';const a=document.createElement('span');a.textContent=`⭐ ${x.title||x.reason}`;const b=document.createElement('span');b.textContent=date(x.createdAt);const c=document.createElement('span');c.className=`status-pill ${x.status}`;c.textContent=x.status==='resolved'?'已解决 ●':'未解决 ●';const d=document.createElement('span');d.textContent=x.status==='resolved'?x.solution:'还在想办法解决中…';row.append(a,b,c,d);e.records.append(row)});enteringId=null}function select(id){const x=entries.find(v=>v.id===id&&v.status==='pending');if(!x)return;selectedId=id;e.selectedTitle.textContent=x.title||'这颗星星';e.selectedMeta.textContent=`${x.reason} · 强度 ${x.intensity}/100 · ${date(x.createdAt)}`;e.solution.value='';e.solution.focus()}e.reason.oninput=()=>e.counter.textContent=`${e.reason.value.length}/100`;e.intensity.oninput=()=>e.intensityValue.textContent=e.intensity.value;e.form.onsubmit=ev=>{ev.preventDefault();const reason=e.reason.value.trim();if(!reason){note('请先写下生气的原因');e.reason.focus();return}const x=norm({id:uid(),title:e.title.value.trim(),reason,intensity:+e.intensity.value,color:new FormData(e.form).get('color'),status:'pending',createdAt:new Date().toISOString()});entries.push(x);enteringId=x.id;if(save()){render();e.form.reset();e.intensity.value=60;e.intensityValue.textContent='60';e.counter.textContent='0/100';note('星星已经飞进瓶子里了 ✨')}};e.resolve.onclick=()=>{const solution=e.solution.value.trim(),x=entries.find(v=>v.id===selectedId&&v.status==='pending');if(!x){note('请先点击瓶中的一颗星星');return}if(!solution){note('写下你是怎么解决的');e.solution.focus();return}const pending=entries.filter(v=>v.status==='pending'),idx=pending.findIndex(v=>v.id===x.id),node=e.stars.children[idx];node?.classList.add('leave');setTimeout(()=>{x.status='resolved';x.solution=solution;x.resolvedAt=new Date().toISOString();selectedId=null;save();render();e.selectedTitle.textContent='这颗星星化成星光啦';e.selectedMeta.textContent='解决方法已保存到成长记录';e.solution.value='';note('你又完成了一次成长 ✨')},620)};load();render();if('serviceWorker'in navigator&&/^https?:$/.test(location.protocol))navigator.serviceWorker.register('./sw.js').catch(()=>{})})();
</script></body></html>
