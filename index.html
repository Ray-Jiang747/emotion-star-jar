<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>我的情绪星星瓶</title>
  <style>
    :root {
      --paper: #fff8ee;
      --paper-deep: #f4e5d4;
      --ink: #553f44;
      --muted: #927579;
      --blush: #f8dfe1;
      --blush-deep: #edb8bf;
      --glass: rgba(255, 255, 255, .53);
      --glass-edge: rgba(255, 255, 255, .82);
      --sun: #f3c96b;
      --sky: #a8d8df;
      --lavender: #cbb8e7;
      --coral: #ee9d93;
      --shadow: 0 18px 36px rgba(116, 76, 77, .14);
    }

    * { box-sizing: border-box; }
    html { min-height: 100%; background: var(--paper); }
    body {
      min-height: 100vh;
      margin: 0;
      color: var(--ink);
      font-family: "KaiTi", "STKaiti", "Noto Serif SC", serif;
      line-height: 1.55;
      background-color: var(--paper);
      background-image:
        linear-gradient(rgba(229, 184, 172, .12) 1px, transparent 1px),
        linear-gradient(90deg, rgba(229, 184, 172, .12) 1px, transparent 1px);
      background-size: 24px 24px;
    }

    main { width: min(1120px, calc(100% - 32px)); margin: 0 auto; padding: 28px 0 64px; }
    header { display: flex; align-items: flex-start; justify-content: space-between; gap: 20px; margin-bottom: 24px; }
    h1, h2, p { margin-top: 0; }
    h1 { margin-bottom: 6px; font-size: clamp(2rem, 7vw, 3.3rem); letter-spacing: .08em; line-height: 1.15; }
    .subtitle { color: var(--muted); font-size: 1.02rem; margin: 0; }

    .cat-sticker { position: relative; flex: 0 0 94px; width: 94px; height: 82px; transform: rotate(5deg); }
    .cat-head { position: absolute; inset: 15px 8px 5px; border: 3px solid var(--ink); border-radius: 44% 44% 48% 48%; background: #f3c7a5; }
    .cat-head::before, .cat-head::after { content: ""; position: absolute; top: -16px; width: 28px; height: 30px; background: #f3c7a5; border: 3px solid var(--ink); z-index: -1; }
    .cat-head::before { left: 3px; border-radius: 90% 15% 30% 15%; transform: rotate(-20deg); }
    .cat-head::after { right: 3px; border-radius: 15% 90% 15% 30%; transform: rotate(20deg); }
    .cat-face { position: absolute; inset: 29px 21px auto; height: 20px; }
    .cat-face::before { content: "•  •"; white-space: pre; letter-spacing: 7px; font-size: 13px; }
    .cat-face::after { content: "⌣"; position: absolute; top: 9px; left: 19px; font-size: 13px; }
    .cat-bow { position: absolute; top: 3px; left: 37px; width: 20px; height: 18px; background: var(--coral); border: 2px solid var(--ink); border-radius: 60% 15% 60% 15%; transform: rotate(25deg); }
    .cat-bow::after { content: ""; position: absolute; left: 12px; top: -2px; width: 20px; height: 18px; background: var(--coral); border: 2px solid var(--ink); border-radius: 15% 60% 15% 60%; transform: rotate(-50deg); }

    .layout { display: grid; gap: 24px; }
    .panel { background: rgba(255, 249, 241, .83); border: 1px solid rgba(197, 142, 139, .28); border-radius: 24px; box-shadow: var(--shadow); }
    .writing-panel { padding: 22px; }
    .section-label { display: block; font-size: 1.18rem; font-weight: 700; margin-bottom: 8px; }
    textarea { width: 100%; min-height: 138px; resize: vertical; border: 0; border-bottom: 2px dashed var(--blush-deep); border-radius: 12px 12px 4px 4px; padding: 14px; color: var(--ink); font: inherit; font-size: 1.08rem; background: rgba(255,255,255,.6); outline-color: var(--blush-deep); }
    .color-choices { display: flex; flex-wrap: wrap; gap: 10px; border: 0; padding: 16px 0 4px; margin: 0; }
    .color-choices legend { font-size: 1.05rem; margin-bottom: 4px; }
    .color-choice { cursor: pointer; display: inline-flex; align-items: center; gap: 7px; padding: 6px 10px; border-radius: 999px; background: rgba(255,255,255,.58); }
    .color-choice input { position: absolute; opacity: 0; }
    .color-choice:has(input:focus-visible) { outline: 3px solid var(--blush-deep); outline-offset: 2px; }
    .swatch { width: 17px; height: 17px; border: 2px solid rgba(85,63,68,.35); border-radius: 50%; }
    .swatch.sun { background: var(--sun); } .swatch.sky { background: var(--sky); } .swatch.lavender { background: var(--lavender); } .swatch.coral { background: var(--coral); }
    .create-button, .resolve-button { border: 0; border-radius: 999px; padding: 10px 20px; color: #fffaf5; background: var(--ink); font: inherit; cursor: pointer; box-shadow: 0 4px 0 #382b30; }
    .create-button:focus-visible, .resolve-button:focus-visible { outline: 3px solid var(--blush-deep); outline-offset: 3px; }
    .create-button:active, .resolve-button:active { transform: translateY(2px); box-shadow: 0 2px 0 #382b30; }

    .bottle-panel { display: grid; place-items: center; min-height: 390px; padding: 24px; overflow: hidden; }
    .bottle-wrap { position: relative; width: min(260px, 72vw); height: 310px; }
    .bottle-neck { position: absolute; z-index: 1; top: 0; left: 88px; width: 84px; height: 65px; border: 5px solid var(--glass-edge); border-bottom: 0; border-radius: 15px 15px 0 0; background: var(--glass); }
    .bottle { position: absolute; bottom: 0; left: 12px; width: 236px; height: 270px; border: 5px solid var(--glass-edge); border-radius: 37% 37% 18% 18% / 22% 22% 12% 12%; background: linear-gradient(120deg, rgba(255,255,255,.66), rgba(198, 228, 224, .22) 52%, rgba(255,255,255,.58)); box-shadow: inset 12px 0 22px rgba(255,255,255,.45), 0 14px 28px rgba(95, 145, 143, .14); }
    .bottle::after { content: ""; position: absolute; left: 18px; top: 26px; width: 8px; height: 180px; border-radius: 99px; background: rgba(255,255,255,.7); transform: rotate(7deg); }
    .bottle-cap { position: absolute; z-index: 2; top: -8px; left: 82px; width: 96px; height: 20px; border: 4px solid var(--glass-edge); border-radius: 9px; background: var(--blush-deep); }
    .empty-note { position: absolute; z-index: 3; inset: 110px 0 auto; text-align: center; color: var(--muted); font-size: 1rem; }
    .star { position: relative; display: inline-block; width: 28px; height: 28px; margin: 7px; background: var(--star-color, var(--sun)); clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 94%, 50% 72%, 20% 94%, 31% 57%, 2% 35%, 39% 35%); filter: drop-shadow(1px 2px 1px rgba(85,63,68,.16)); }
    .notes { display: grid; gap: 16px; }
    .notes-section { padding: 18px 20px; min-height: 128px; }
    .notes-section h2 { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; font-size: 1.22rem; }
    .count { color: var(--muted); font-size: .88rem; font-weight: normal; }
    .empty-state { margin: 0; color: var(--muted); font-size: .98rem; }
    .note-list { display: flex; flex-wrap: wrap; gap: 8px; }
    .note-list > * { display: none; }
    .note-card { width: 100%; border: 1px dashed rgba(197, 142, 139, .44); border-radius: 13px; padding: 10px 12px; color: var(--ink); background: rgba(255,255,255,.52); text-align: left; font: inherit; }
    button.note-card { cursor: pointer; }
    button.note-card:focus-visible { outline: 3px solid var(--blush-deep); outline-offset: 3px; }
    .note-card > span { display: block; margin: 0 0 5px; }
    .note-card > span:last-child { margin-bottom: 0; }
    .resolved-card { border-style: solid; border-color: rgba(168, 216, 223, .75); }
    dialog { width: min(420px, calc(100% - 28px)); border: 1px solid var(--blush-deep); border-radius: 20px; padding: 22px; color: var(--ink); background: var(--paper); box-shadow: var(--shadow); }
    dialog::backdrop { background: rgba(85, 63, 68, .3); }
    dialog h2 { margin-bottom: 12px; }
    dialog textarea { min-height: 100px; margin-bottom: 14px; }
    .status { min-height: 1.6em; margin: 12px 2px 0; color: var(--muted); }

    @media (prefers-reduced-motion: no-preference) {
      .star-departure { position: fixed; z-index: 20; margin: 0; pointer-events: none; animation: star-departure .52s ease-in forwards; }
      @keyframes star-departure {
        to { opacity: 0; transform: translateY(-48px) rotate(18deg) scale(.62); }
      }
    }

    @media (min-width: 720px) {
      .layout { grid-template-columns: minmax(260px, .9fr) minmax(320px, 1.1fr); align-items: start; }
      .writing-panel { grid-column: 1; }
      .bottle-panel { grid-column: 2; grid-row: 1 / span 2; }
      .notes { grid-column: 1; }
    }
    @media (max-width: 719px) {
      header { align-items: center; }
      .cat-sticker { transform: scale(.8) rotate(5deg); transform-origin: right center; margin-right: -10px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; transition-duration: .01ms !important; }
      .create-button:active, .resolve-button:active { transform: none; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div><h1>我的情绪星星瓶</h1><p class="subtitle">把此刻的心情折成一颗小星星，慢慢照亮自己。</p></div>
      <div class="cat-sticker" role="img" aria-label="戴蝴蝶结的圆耳小猫贴纸"><div class="cat-head"><div class="cat-face"></div></div><div class="cat-bow"></div></div>
    </header>

    <div class="layout">
      <section class="panel writing-panel" aria-labelledby="write-heading">
        <span id="write-heading" class="section-label">写下这一刻</span>
        <form id="reason-form">
          <label for="reason-input" class="section-label">让我有这种情绪的原因是……</label>
          <textarea id="reason-input" name="reason" placeholder="可以只写几个词，也可以写一整段话。"></textarea>
          <fieldset id="color-picker" class="color-choices">
            <legend>为这颗星星选个颜色</legend>
            <label class="color-choice"><input id="color-sun" type="radio" name="star-color" value="sun" checked><span class="swatch sun" aria-hidden="true"></span>暖黄</label>
            <label class="color-choice"><input id="color-sky" type="radio" name="star-color" value="sky"><span class="swatch sky" aria-hidden="true"></span>晴蓝</label>
            <label class="color-choice"><input id="color-lavender" type="radio" name="star-color" value="lavender"><span class="swatch lavender" aria-hidden="true"></span>淡紫</label>
            <label class="color-choice"><input id="color-coral" type="radio" name="star-color" value="coral"><span class="swatch coral" aria-hidden="true"></span>珊瑚</label>
          </fieldset>
          <button id="create-star" class="create-button" type="submit">折一颗星星</button>
        </form>
        <p class="status" id="status" aria-live="polite"></p>
      </section>

      <section class="panel bottle-panel" aria-labelledby="bottle-heading">
        <div class="bottle-wrap" aria-label="中央玻璃星星瓶">
          <div class="bottle-neck"></div><div class="bottle-cap" aria-hidden="true"></div>
          <div id="bottle-stars" class="bottle" aria-live="polite"></div>
          <p class="empty-note">瓶子还空着<br>等一颗星星来陪你</p>
        </div>
        <h2 id="bottle-heading" hidden>中央玻璃星星瓶</h2>
      </section>

      <div class="notes">
        <section class="panel notes-section" aria-labelledby="pending-heading">
          <h2 id="pending-heading">还在瓶里的星星 <span class="count">0 颗</span></h2>
          <div id="pending-list" class="note-list"></div><p class="empty-state">这里会收集还想被温柔看见的情绪。</p>
        </section>
        <section class="panel notes-section" aria-labelledby="resolved-heading">
          <h2 id="resolved-heading">已经解决啦 <span class="count">0 颗</span></h2>
          <div id="resolved-list" class="note-list"></div><p class="empty-state">解决一颗之后，它会在这里闪闪发光。</p>
        </section>
      </div>
    </div>

    <dialog id="star-dialog" aria-labelledby="dialog-heading">
      <form method="dialog">
        <h2 id="dialog-heading">给这颗星星一句回应</h2>
        <p id="dialog-reason" class="status"></p>
        <label for="solution-input" class="section-label">我准备这样照顾自己……</label>
        <textarea id="solution-input" name="solution" placeholder="比如：先喝一杯水，再休息十分钟。"></textarea>
        <button id="resolve-star" class="resolve-button" value="resolve" type="submit">解决啦</button>
      </form>
    </dialog>
  </main>
  <script>
    (() => {
      const storageKey = 'emotion-star-jar:v1';
      const colorMap = {
        sun: { stored: 'yellow', css: '--sun' },
        sky: { stored: 'blue', css: '--sky' },
        lavender: { stored: 'purple', css: '--lavender' },
        coral: { stored: 'pink', css: '--coral' },
        yellow: { stored: 'yellow', css: '--sun' },
        blue: { stored: 'blue', css: '--sky' },
        purple: { stored: 'purple', css: '--lavender' },
        pink: { stored: 'pink', css: '--coral' }
      };
      const validColors = new Set(['pink', 'yellow', 'blue', 'purple']);
      const validStatuses = new Set(['pending', 'resolved']);
      const form = document.querySelector('#reason-form');
      const reasonInput = document.querySelector('#reason-input');
      const bottleStars = document.querySelector('#bottle-stars');
      const pendingList = document.querySelector('#pending-list');
      const resolvedList = document.querySelector('#resolved-list');
      const emptyBottle = document.querySelector('.empty-note');
      const pendingEmpty = pendingList.nextElementSibling;
      const resolvedEmpty = resolvedList.nextElementSibling;
      const counts = document.querySelectorAll('.count');
      const status = document.querySelector('#status');
      const starDialog = document.querySelector('#star-dialog');
      const dialogReason = document.querySelector('#dialog-reason');
      const solutionInput = document.querySelector('#solution-input');

      function announce(message) {
        status.textContent = message;
      }

      function dateLabel(dateValue) {
        const date = new Date(dateValue);
        return Number.isNaN(date.getTime()) ? '未知日期' : new Intl.DateTimeFormat('zh-CN', { dateStyle: 'medium', timeStyle: 'short' }).format(date);
      }

      function mappedColor(color) {
        return colorMap[color] || colorMap.sun;
      }

      function createId() {
        if (window.crypto && typeof window.crypto.randomUUID === 'function') {
          return window.crypto.randomUUID();
        }
        return `${Date.now()}-${Math.random().toString(16).slice(2)}`;
      }

      function isValidStarEntry(star) {
        if (!star || typeof star !== 'object') return false;
        if (typeof star.id !== 'string' || typeof star.reason !== 'string' || typeof star.createdAt !== 'string' || typeof star.solution !== 'string') return false;
        if (!validColors.has(star.color) || !validStatuses.has(star.status)) return false;
        if (star.status === 'pending') return star.resolvedAt === null;
        return typeof star.resolvedAt === 'string';
      }

      function loadStars() {
        try {
          const raw = window.localStorage.getItem(storageKey);
          if (raw === null) return [];
          const stars = JSON.parse(raw);
          if (!Array.isArray(stars)) throw new Error('Stored value is not an array');
          if (!stars.every(isValidStarEntry)) throw new Error('Stored array contains an invalid entry');
          return stars;
        } catch (error) {
          announce('读取星星时出了点问题，已从空瓶重新开始。');
          return [];
        }
      }

      function saveStars(stars) {
        try {
          window.localStorage.setItem(storageKey, JSON.stringify(stars));
          return true;
        } catch (error) {
          announce('暂时没有存好这颗星星，请稍后再试。');
          return false;
        }
      }

      function createStar(reason, color) {
        const mapped = mappedColor(color);
        return {
          id: createId(),
          reason: reason.trim(),
          color: mapped.stored,
          status: 'pending',
          createdAt: new Date().toISOString(),
          solution: '',
          resolvedAt: null
        };
      }

      function makeCard(star, isResolved) {
        const card = document.createElement(isResolved ? 'article' : 'button');
        if (!isResolved) card.type = 'button';
        card.className = isResolved ? 'note-card resolved-card' : 'note-card';
        card.style.display = 'block';
        const reason = document.createElement('span');
        reason.textContent = star.reason;
        if (isResolved) {
          const solution = document.createElement('span');
          solution.textContent = `我的回应：${star.solution}`;
          const created = document.createElement('span');
          created.className = 'count';
          created.textContent = `折于 ${dateLabel(star.createdAt)}`;
          const resolved = document.createElement('span');
          resolved.className = 'count';
          resolved.textContent = `解决于 ${dateLabel(star.resolvedAt)}`;
          card.append(reason, solution, created, resolved);
        } else {
          const date = document.createElement('span');
          date.className = 'count';
          date.textContent = `折于 ${dateLabel(star.createdAt)}`;
          card.append(reason, date);
          card.setAttribute('aria-label', `回应这颗星星：${star.reason}`);
          card.addEventListener('click', () => openStar(star.id));
        }
        return card;
      }

      function render(stars) {
        const pending = stars.filter((star) => star.status === 'pending');
        const resolved = stars.filter((star) => star.status === 'resolved');
        bottleStars.replaceChildren();
        pendingList.replaceChildren();
        resolvedList.replaceChildren();

        pending.forEach((star) => {
          const button = document.createElement('button');
          button.type = 'button';
          button.className = 'star';
          button.style.setProperty('--star-color', `var(${mappedColor(star.color).css})`);
          button.dataset.starId = star.id;
          button.setAttribute('aria-label', `回应星星：${star.reason}`);
          button.addEventListener('click', () => openStar(star.id));
          bottleStars.append(button);
          pendingList.append(makeCard(star, false));
        });
        resolved
          .sort((first, second) => new Date(second.resolvedAt).getTime() - new Date(first.resolvedAt).getTime())
          .forEach((star) => resolvedList.append(makeCard(star, true)));

        emptyBottle.hidden = pending.length > 0;
        pendingEmpty.hidden = pending.length > 0;
        resolvedEmpty.hidden = resolved.length > 0;
        counts[0].textContent = `${pending.length} 颗`;
        counts[1].textContent = `${resolved.length} 颗`;
      }

      function openStar(id) {
        const star = loadStars().find((entry) => entry.id === id && entry.status === 'pending');
        if (!star) return;
        starDialog.dataset.starId = star.id;
        dialogReason.textContent = `这颗星星写着：${star.reason}`;
        solutionInput.value = '';
        starDialog.showModal();
        solutionInput.focus();
      }

      function animateDeparture(star) {
        if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
        const source = bottleStars.querySelector(`[data-star-id="${star.id}"]`);
        if (!source) return;
        const bounds = source.getBoundingClientRect();
        const departure = source.cloneNode();
        departure.classList.add('star-departure');
        departure.removeAttribute('data-star-id');
        departure.setAttribute('aria-hidden', 'true');
        departure.style.left = `${bounds.left}px`;
        departure.style.top = `${bounds.top}px`;
        document.body.append(departure);
        departure.addEventListener('animationend', () => departure.remove(), { once: true });
        window.setTimeout(() => departure.remove(), 700);
      }

      function resolveStar(id, solution) {
        const trimmedSolution = solution.trim();
        if (!trimmedSolution) {
          announce('写下你是怎么解决的，再让这颗星星离开瓶子吧。');
          return false;
        }
        const stars = loadStars();
        const target = stars.find((star) => star.id === id && star.status === 'pending');
        if (!target) return false;
        const resolvedAt = new Date().toISOString();
        const nextStars = stars.map((star) => star.id === id
          ? { ...star, status: 'resolved', solution: trimmedSolution, resolvedAt }
          : star);
        if (!saveStars(nextStars)) return false;
        animateDeparture(target);
        starDialog.close();
        render(nextStars);
        announce('这颗星星已经带着你的回应，轻轻离开瓶子了。');
        return true;
      }

      form.addEventListener('submit', (event) => {
        event.preventDefault();
        const reason = reasonInput.value.trim();
        if (!reason) {
          announce('请先写下让你生气的原因，再折成星星。');
          return;
        }
        const selected = form.elements['star-color'].value;
        const stars = loadStars();
        const nextStars = [...stars, createStar(reason, selected)];
        if (saveStars(nextStars)) {
          render(nextStars);
          form.reset();
          announce('这颗星星已经安静地放进瓶子里了。');
        }
      });

      starDialog.querySelector('form').addEventListener('submit', (event) => {
        event.preventDefault();
        resolveStar(starDialog.dataset.starId, solutionInput.value);
      });

      window.loadStars = loadStars;
      window.saveStars = saveStars;
      window.createStar = createStar;
      window.render = render;
      window.openStar = openStar;
      window.resolveStar = resolveStar;
      render(loadStars());
    })();
  </script>
</body>
</html>
