<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101a3b">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#070b1c">
  <title>我的情绪星星瓶</title>
  <style>
    :root { --night:#070b1c; --night-blue:#101a3b; --ink:#f6f4ff; --muted:#aab4d6; --glass:rgba(180,211,255,.14); --glass-edge:rgba(224,239,255,.72); --sheet:#111a37; --sheet-edge:rgba(203,220,255,.18); --sun:#ffd675; --sky:#7dc8ff; --lavender:#c8a7ff; --coral:#ff998d; --focus:#fff3a5; --pending-count:0; }
    * { box-sizing:border-box; }
    html { min-height:100%; background:var(--night); color-scheme:dark; }
    body { min-height:100vh; margin:0; color:var(--ink); font-family:ui-rounded,"PingFang SC","Microsoft YaHei",system-ui,sans-serif; line-height:1.5; background:radial-gradient(circle at 17% 8%,rgba(148,124,255,.28),transparent 22rem),radial-gradient(circle at 92% 76%,rgba(62,132,255,.2),transparent 20rem),linear-gradient(160deg,#141f48 0%,var(--night) 58%,#060816 100%); }
    button,textarea { font:inherit; } button { -webkit-tap-highlight-color:transparent; }
    button:focus-visible,textarea:focus-visible,[tabindex]:focus-visible { outline:3px solid var(--focus); outline-offset:4px; }
    [hidden] { display:none !important; }
    .app-shell { position:relative; min-height:100svh; overflow:hidden; }
    .app-shell::before,.app-shell::after { content:""; position:fixed; pointer-events:none; inset:0; opacity:.72; background-image:radial-gradient(circle,rgba(255,255,255,.93) 0 1px,transparent 1.7px); background-size:73px 89px; background-position:8px 13px; mask-image:linear-gradient(to bottom,black,transparent 76%); }
    .app-shell::after { background-size:127px 113px; background-position:41px 67px; opacity:.35; }
    main { position:relative; z-index:1; min-height:100svh; width:min(100%,520px); margin:0 auto; padding:max(18px,env(safe-area-inset-top)) 20px calc(102px + env(safe-area-inset-bottom)); }
    .top-status { display:flex; align-items:center; justify-content:space-between; min-height:36px; color:var(--muted); font-size:.81rem; letter-spacing:.04em; }
    .top-status::before { content:"今夜的星星瓶"; }
    .status { min-height:1.5em; max-width:220px; margin:0; text-align:right; color:#dce4ff; }
    .status:empty::after { content:"轻轻收集此刻"; color:var(--muted); }
    .bottle-stage { position:relative; display:grid; place-items:center; min-height:calc(100svh - 136px); padding:14px 0 38px; }
    .bottle-stage::before { content:""; position:absolute; width:min(86vw,388px); aspect-ratio:1; border-radius:50%; background:radial-gradient(circle,rgba(119,157,255,calc(.09 + var(--pending-count) * .017)),transparent 66%); filter:blur(10px); }
    .bottle-wrap { position:relative; z-index:1; width:min(79vw,332px); height:min(76vh,470px); min-height:374px; filter:drop-shadow(0 28px 23px rgba(0,0,0,.4)); }
    .bottle-wrap::before { content:""; position:absolute; left:9%; right:9%; bottom:-11px; height:42px; border-radius:50%; background:radial-gradient(ellipse,rgba(113,156,255,.42),rgba(43,68,152,.1) 56%,transparent 72%); filter:blur(8px); }
    .bottle-cap { position:absolute; z-index:5; top:1%; left:34%; width:32%; height:28px; border:2px solid rgba(255,255,255,.58); border-radius:11px 11px 8px 8px; background:linear-gradient(#9d98d9,#615d9b); box-shadow:inset 0 5px 5px rgba(255,255,255,.32),0 5px 12px rgba(0,0,0,.24); }
    .bottle-neck { position:absolute; z-index:3; top:6%; left:36%; width:28%; height:22%; border:4px solid var(--glass-edge); border-bottom:0; border-radius:17px 17px 0 0; background:linear-gradient(90deg,rgba(255,255,255,.38),rgba(128,185,255,.08) 48%,rgba(255,255,255,.27)); box-shadow:inset 8px 0 12px rgba(255,255,255,.32),inset -7px 0 16px rgba(91,140,250,.12); }
    .bottle { position:absolute; isolation:isolate; overflow:hidden; bottom:0; left:2%; width:96%; height:80%; padding:23% 10% 11%; border:5px solid var(--glass-edge); border-radius:42% 42% 20% 20% / 26% 26% 14% 14%; background:linear-gradient(104deg,rgba(255,255,255,.34) 0 6%,var(--glass) 24%,rgba(87,141,224,.23) 58%,rgba(255,255,255,.31) 92%); box-shadow:inset 15px 0 25px rgba(255,255,255,.3),inset -17px -10px 26px rgba(59,109,211,.18),inset 0 -18px 31px rgba(85,147,247,.2),0 0 calc(16px + var(--pending-count) * 3px) rgba(125,177,255,calc(.12 + var(--pending-count) * .018)); }
    .bottle::before { content:""; position:absolute; z-index:-1; inset:10px; border:1px solid rgba(235,246,255,.25); border-radius:inherit; background:linear-gradient(112deg,rgba(255,255,255,.2),transparent 28%,rgba(115,170,255,.13) 70%,rgba(255,255,255,.23)); }
    .bottle::after { content:""; position:absolute; z-index:2; top:14%; left:13%; width:9px; height:59%; border-radius:99px; background:linear-gradient(90deg,transparent,rgba(255,255,255,.84),transparent); box-shadow:54px 15px 0 -4px rgba(255,255,255,.17); transform:rotate(7deg); pointer-events:none; }
    .empty-note { position:absolute; z-index:3; top:47%; left:12%; right:12%; margin:0; color:rgba(233,240,255,.78); text-align:center; font-size:.88rem; letter-spacing:.08em; }
    .star { position:relative; display:inline-block; width:31px; height:31px; margin:6px 4px; border:0; padding:0; cursor:pointer; background:conic-gradient(from 18deg,color-mix(in srgb,var(--star-color,var(--sun)) 68%,white) 0 16%,var(--star-color,var(--sun)) 16% 42%,color-mix(in srgb,var(--star-color,var(--sun)) 66%,#776398) 42% 64%,color-mix(in srgb,var(--star-color,var(--sun)) 86%,white) 64% 83%,var(--star-color,var(--sun)) 83%); clip-path:polygon(50% 0%,61% 35%,98% 35%,68% 57%,79% 94%,50% 72%,20% 94%,31% 57%,2% 35%,39% 35%); filter:drop-shadow(0 3px 4px rgba(0,0,0,.35)); transform:rotate(var(--tilt,-6deg)); }
    .star::after { content:""; position:absolute; top:5px; left:8px; width:9px; height:6px; border-radius:50%; background:rgba(255,255,255,.65); transform:rotate(-25deg); }
    .star:hover,.star:focus-visible { transform:translateY(-4px) rotate(var(--tilt,-6deg)) scale(1.12); filter:drop-shadow(0 7px 6px rgba(0,0,0,.35)); }
    .bottle .star:nth-child(3n + 1) { --tilt:9deg; } .bottle .star:nth-child(3n + 2) { --tilt:-13deg; } .bottle .star:nth-child(3n) { --tilt:2deg; }
    .history-trigger { position:absolute; z-index:4; bottom:1px; left:50%; width:92px; height:26px; border:0; border-radius:999px; transform:translateX(-50%); cursor:pointer; color:transparent; background:linear-gradient(90deg,transparent 17%,rgba(225,235,255,.58) 17% 83%,transparent 83%); }
    .history-trigger::after { content:"向上滑动查看收藏"; position:absolute; top:29px; left:50%; transform:translateX(-50%); width:170px; color:var(--muted); font-size:.73rem; letter-spacing:.12em; white-space:nowrap; }
    .floating-action { position:fixed; z-index:10; right:max(20px,env(safe-area-inset-right)); bottom:max(22px,env(safe-area-inset-bottom)); display:inline-flex; align-items:center; gap:9px; min-height:58px; padding:0 21px; border:1px solid rgba(255,255,255,.72); border-radius:999px; cursor:pointer; color:#151431; font-weight:800; letter-spacing:.04em; background:linear-gradient(135deg,#fff6b8,#ffcde9 90%); box-shadow:0 13px 30px rgba(0,0,0,.34),inset 0 1px rgba(255,255,255,.9); }
    .floating-action::before { content:"+"; display:grid; place-items:center; width:22px; height:22px; border-radius:50%; color:white; background:#6861b2; font-size:1.3rem; font-weight:400; line-height:1; }
    dialog { width:min(100%,520px); max-width:520px; max-height:min(78svh,680px); margin:auto auto 0; border:1px solid var(--sheet-edge); border-bottom:0; border-radius:28px 28px 0 0; padding:0; color:var(--ink); background:linear-gradient(155deg,#18254c,var(--sheet) 42%); box-shadow:0 -20px 50px rgba(0,0,0,.28); }
    dialog::backdrop { background:rgba(3,5,18,.66); backdrop-filter:blur(4px); }
    .sheet { position:relative; padding:14px 20px calc(24px + env(safe-area-inset-bottom)); overflow:auto; }
    .sheet-handle { width:44px; height:5px; margin:0 auto 15px; border-radius:99px; background:rgba(224,234,255,.38); }
    .sheet-heading { margin:0 42px 3px 0; font-size:1.2rem; letter-spacing:.03em; }
    .sheet-copy { margin:0 0 18px; color:var(--muted); font-size:.9rem; }
    .sheet-close { position:absolute; top:19px; right:18px; width:34px; height:34px; border:0; border-radius:50%; cursor:pointer; color:var(--ink); background:rgba(255,255,255,.1); font-size:1.28rem; line-height:1; }
    .section-label { display:block; margin:13px 0 8px; color:#e4e9ff; font-size:.92rem; font-weight:700; }
    textarea { width:100%; min-height:124px; resize:vertical; border:1px solid rgba(218,229,255,.2); border-radius:16px; padding:14px; color:var(--ink); background:rgba(2,6,23,.3); } textarea::placeholder { color:#8994bb; }
    .color-choices { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; border:0; padding:0; margin:0; }
    .color-choices legend { grid-column:1 / -1; margin:0 0 2px; color:#e4e9ff; font-size:.92rem; font-weight:700; }
    .color-choice { display:grid; place-items:center; gap:5px; min-height:61px; border:1px solid transparent; border-radius:14px; cursor:pointer; color:var(--muted); font-size:.73rem; background:rgba(255,255,255,.05); }
    .color-choice input { position:absolute; opacity:0; } .color-choice:has(input:checked) { border-color:rgba(255,255,255,.62); color:var(--ink); background:rgba(255,255,255,.12); } .color-choice:has(input:focus-visible) { outline:3px solid var(--focus); outline-offset:3px; }
    .swatch { width:20px; height:20px; border:2px solid rgba(255,255,255,.7); border-radius:50%; box-shadow:0 0 12px currentColor; }
    .swatch.sun { color:var(--sun); background:var(--sun); } .swatch.sky { color:var(--sky); background:var(--sky); } .swatch.lavender { color:var(--lavender); background:var(--lavender); } .swatch.coral { color:var(--coral); background:var(--coral); }
    .sheet-submit,.resolve-button { width:100%; min-height:49px; margin-top:18px; border:0; border-radius:15px; cursor:pointer; color:#17152d; font-weight:800; background:linear-gradient(135deg,#fff4ad,#ffb9df); box-shadow:0 7px 0 rgba(71,49,109,.55); }
    .sheet-submit:active,.resolve-button:active { transform:translateY(3px); box-shadow:0 4px 0 rgba(71,49,109,.55); }
    .tablist { display:grid; grid-template-columns:1fr 1fr; gap:7px; margin:16px 0 14px; padding:5px; border-radius:15px; background:rgba(0,0,0,.18); }
    .tab { min-height:39px; border:0; border-radius:11px; cursor:pointer; color:var(--muted); background:transparent; } .tab[aria-selected="true"] { color:var(--ink); font-weight:700; background:rgba(196,213,255,.18); }
    .count { color:var(--muted); font-size:.79rem; font-weight:normal; } .note-list { display:grid; gap:9px; }
    .note-card { width:100%; border:1px solid rgba(203,220,255,.18); border-radius:15px; padding:12px 13px; color:var(--ink); background:rgba(255,255,255,.055); text-align:left; } button.note-card { cursor:pointer; } .note-card > span { display:block; margin:0 0 5px; } .note-card > span:last-child { margin-bottom:0; }
    .resolved-card { border-color:rgba(144,217,255,.27); background:rgba(93,177,235,.08); } .empty-state { margin:14px 2px; color:var(--muted); font-size:.9rem; text-align:center; }
    #star-dialog { margin:auto; border-bottom:1px solid var(--sheet-edge); border-radius:24px; } #star-dialog .sheet { padding-top:16px; }
    @media (prefers-reduced-motion:no-preference) { .star { animation:star-float 4.6s ease-in-out infinite; animation-delay:calc(var(--tilt,0deg) * .01s); } .star-departure { position:fixed; z-index:20; margin:0; pointer-events:none; animation:star-departure .52s ease-in forwards; } @keyframes star-float { 50% { translate:0 -5px; } } @keyframes star-departure { to { opacity:0; transform:translateY(-52px) rotate(18deg) scale(.62); } } }
    @media (min-width:521px) { dialog { border-bottom:1px solid var(--sheet-edge); border-radius:28px; margin:auto; } }
    @media (prefers-reduced-motion:reduce) { *,*::before,*::after { animation-duration:.01ms !important; animation-iteration-count:1 !important; scroll-behavior:auto !important; transition-duration:.01ms !important; } }
  </style>
</head>
<body>
  <div class="app-shell">
    <main>
      <div class="top-status"><p class="status" id="status" aria-live="polite"></p></div>
      <section class="bottle-stage" aria-labelledby="bottle-heading">
        <div class="bottle-wrap" aria-label="情绪星星瓶">
          <div class="bottle-cap" aria-hidden="true"></div><div class="bottle-neck" aria-hidden="true"></div>
          <div id="bottle-stars" class="bottle" aria-live="polite"></div>
          <p class="empty-note">瓶子还空着<br>等一颗星星来陪你</p>
          <button id="history-button" class="history-trigger" type="button" aria-label="查看星星收藏">查看星星收藏</button>
        </div>
        <h1 id="bottle-heading" hidden>我的情绪星星瓶</h1>
      </section>
    </main>
    <button id="create-star" class="floating-action" type="button" aria-haspopup="dialog" aria-controls="create-sheet">折一颗星星</button>
    <dialog id="create-sheet" aria-labelledby="write-heading">
      <div class="sheet">
        <div class="sheet-handle" aria-hidden="true"></div><button class="sheet-close" type="button" data-close-sheet="create-sheet" aria-label="关闭写星星面板">×</button>
        <h2 id="write-heading" class="sheet-heading">把这一刻折成星星</h2><p class="sheet-copy">写下来，不需要把它立刻解决。</p>
        <form id="reason-form">
          <label for="reason-input" class="section-label">让我有这种情绪的原因是……</label><textarea id="reason-input" name="reason" placeholder="可以只写几个词，也可以写一整段话。"></textarea>
          <fieldset id="color-picker" class="color-choices">
            <legend>为这颗星星选个颜色</legend>
            <label class="color-choice"><input id="color-sun" type="radio" name="star-color" value="sun" checked><span class="swatch sun" aria-hidden="true"></span>暖黄</label>
            <label class="color-choice"><input id="color-sky" type="radio" name="star-color" value="sky"><span class="swatch sky" aria-hidden="true"></span>晴蓝</label>
            <label class="color-choice"><input id="color-lavender" type="radio" name="star-color" value="lavender"><span class="swatch lavender" aria-hidden="true"></span>淡紫</label>
            <label class="color-choice"><input id="color-coral" type="radio" name="star-color" value="coral"><span class="swatch coral" aria-hidden="true"></span>珊瑚</label>
          </fieldset>
          <button class="sheet-submit" type="submit">放进瓶子里</button>
        </form>
      </div>
    </dialog>
    <dialog id="history-sheet" aria-labelledby="history-heading">
      <div class="sheet">
        <div class="sheet-handle" aria-hidden="true"></div><button class="sheet-close" type="button" data-close-sheet="history-sheet" aria-label="关闭星星收藏">×</button>
        <h2 id="history-heading" class="sheet-heading">星星收藏</h2><p class="sheet-copy">轻点还在瓶里的星星，给它一句回应。</p>
        <div class="tablist" role="tablist" aria-label="星星状态">
          <button id="pending-tab" class="tab" type="button" role="tab" aria-selected="true" aria-controls="pending-panel">瓶中 <span id="pending-tab-count" class="count">0 颗</span></button>
          <button id="resolved-tab" class="tab" type="button" role="tab" aria-selected="false" aria-controls="resolved-panel">已解决 <span id="resolved-tab-count" class="count">0 颗</span></button>
        </div>
        <section id="pending-panel" role="tabpanel" aria-labelledby="pending-tab"><h3 id="pending-heading" hidden>还在瓶里的星星 <span id="pending-count" class="count">0 颗</span></h3><div id="pending-list" class="note-list"></div><p class="empty-state">这里会收集还想被温柔看见的情绪。</p></section>
        <section id="resolved-panel" role="tabpanel" aria-labelledby="resolved-tab" hidden><h3 id="resolved-heading" hidden>已经解决啦 <span id="resolved-count" class="count">0 颗</span></h3><div id="resolved-list" class="note-list"></div><p class="empty-state">解决一颗之后，它会在这里闪闪发光。</p></section>
      </div>
    </dialog>
    <dialog id="star-dialog" aria-labelledby="dialog-heading">
      <form class="sheet" method="dialog">
        <div class="sheet-handle" aria-hidden="true"></div><h2 id="dialog-heading" class="sheet-heading">给这颗星星一句回应</h2><p id="dialog-reason" class="sheet-copy"></p>
        <label for="solution-input" class="section-label">我准备这样照顾自己……</label><textarea id="solution-input" name="solution" placeholder="比如：先喝一杯水，再休息十分钟。"></textarea>
        <button id="resolve-star" class="resolve-button" value="resolve" type="submit">解决啦</button>
      </form>
    </dialog>
  </div>
  <script>
    (() => {
      const storageKey = 'emotion-star-jar:v1';
      const colorMap = { sun:{stored:'yellow',css:'--sun'}, sky:{stored:'blue',css:'--sky'}, lavender:{stored:'purple',css:'--lavender'}, coral:{stored:'pink',css:'--coral'}, yellow:{stored:'yellow',css:'--sun'}, blue:{stored:'blue',css:'--sky'}, purple:{stored:'purple',css:'--lavender'}, pink:{stored:'pink',css:'--coral'} };
      const validColors = new Set(['pink','yellow','blue','purple']); const validStatuses = new Set(['pending','resolved']);
      const form = document.querySelector('#reason-form'); const reasonInput = document.querySelector('#reason-input'); const bottleStars = document.querySelector('#bottle-stars'); const pendingList = document.querySelector('#pending-list'); const resolvedList = document.querySelector('#resolved-list'); const emptyBottle = document.querySelector('.empty-note'); const pendingEmpty = pendingList.nextElementSibling; const resolvedEmpty = resolvedList.nextElementSibling; const status = document.querySelector('#status'); const createButton = document.querySelector('#create-star'); const createSheet = document.querySelector('#create-sheet'); const historySheet = document.querySelector('#history-sheet'); const historyButton = document.querySelector('#history-button'); const starDialog = document.querySelector('#star-dialog'); const dialogReason = document.querySelector('#dialog-reason'); const solutionInput = document.querySelector('#solution-input'); const pendingTab = document.querySelector('#pending-tab'); const resolvedTab = document.querySelector('#resolved-tab'); const pendingPanel = document.querySelector('#pending-panel'); const resolvedPanel = document.querySelector('#resolved-panel');
      let stars = []; let dialogReturnFocus = null;
      function announce(message) { status.textContent = message; }
      function dateLabel(dateValue) { const date = new Date(dateValue); return Number.isNaN(date.getTime()) ? '未知日期' : new Intl.DateTimeFormat('zh-CN',{dateStyle:'medium',timeStyle:'short'}).format(date); }
      function mappedColor(color) { return colorMap[color] || colorMap.sun; }
      function createId() { return window.crypto && typeof window.crypto.randomUUID === 'function' ? window.crypto.randomUUID() : `${Date.now()}-${Math.random().toString(16).slice(2)}`; }
      function isValidStarEntry(star) { if (!star || typeof star !== 'object') return false; if (typeof star.id !== 'string' || typeof star.reason !== 'string' || typeof star.createdAt !== 'string' || typeof star.solution !== 'string') return false; if (!validColors.has(star.color) || !validStatuses.has(star.status)) return false; return star.status === 'pending' ? star.resolvedAt === null : typeof star.resolvedAt === 'string'; }
      function loadStars() { try { const raw = window.localStorage.getItem(storageKey); if (raw === null) return (stars=[]); const storedStars = JSON.parse(raw); if (!Array.isArray(storedStars) || !storedStars.every(isValidStarEntry)) throw new Error('Invalid stored stars'); return (stars=storedStars); } catch (error) { stars=[]; announce('读取星星时出了点问题，已从空瓶重新开始。'); return stars; } }
      function saveStars(nextStars) { try { window.localStorage.setItem(storageKey,JSON.stringify(nextStars)); stars=nextStars; return true; } catch (error) { announce('这台设备暂时无法保存记录；请稍后重试。'); return false; } }
      function createStar(reason,color) { const mapped = mappedColor(color); return {id:createId(),reason:reason.trim(),color:mapped.stored,status:'pending',createdAt:new Date().toISOString(),solution:'',resolvedAt:null}; }
      function makeCard(star,isResolved) { const card = document.createElement(isResolved ? 'article' : 'button'); if (!isResolved) card.type='button'; card.className=isResolved ? 'note-card resolved-card' : 'note-card'; const reason=document.createElement('span'); reason.textContent=star.reason; if (isResolved) { const solution=document.createElement('span'); solution.textContent=`我的回应：${star.solution}`; const created=document.createElement('span'); created.className='count'; created.textContent=`折于 ${dateLabel(star.createdAt)}`; const resolved=document.createElement('span'); resolved.className='count'; resolved.textContent=`解决于 ${dateLabel(star.resolvedAt)}`; card.append(reason,solution,created,resolved); } else { const date=document.createElement('span'); date.className='count'; date.textContent=`折于 ${dateLabel(star.createdAt)}`; card.append(reason,date); card.setAttribute('aria-label',`回应这颗星星：${star.reason}`); card.addEventListener('click',()=>openStar(star.id)); } return card; }
      function render(nextStars) { const pending=nextStars.filter((star)=>star.status==='pending'); const resolved=nextStars.filter((star)=>star.status==='resolved'); bottleStars.replaceChildren(); pendingList.replaceChildren(); resolvedList.replaceChildren(); pending.forEach((star)=>{const button=document.createElement('button'); button.type='button'; button.className='star'; button.style.setProperty('--star-color',`var(${mappedColor(star.color).css})`); button.dataset.starId=star.id; button.setAttribute('aria-label',`回应星星：${star.reason}`); button.addEventListener('click',()=>openStar(star.id)); bottleStars.append(button); pendingList.append(makeCard(star,false));}); resolved.sort((first,second)=>new Date(second.resolvedAt).getTime()-new Date(first.resolvedAt).getTime()).forEach((star)=>resolvedList.append(makeCard(star,true))); emptyBottle.hidden=pending.length>0; pendingEmpty.hidden=pending.length>0; resolvedEmpty.hidden=resolved.length>0; document.querySelector('#pending-count').textContent=`${pending.length} 颗`; document.querySelector('#resolved-count').textContent=`${resolved.length} 颗`; document.querySelector('#pending-tab-count').textContent=`${pending.length} 颗`; document.querySelector('#resolved-tab-count').textContent=`${resolved.length} 颗`; document.documentElement.style.setProperty('--pending-count',Math.min(pending.length,8)); }
      function showSheet(sheet,focusTarget) { dialogReturnFocus=focusTarget || document.activeElement; if (!sheet.open) sheet.showModal(); }
      function closeSheet(sheet) { if (sheet.open) sheet.close(); }
      function setHistoryTab(tab) { const pendingActive=tab==='pending'; pendingTab.setAttribute('aria-selected',String(pendingActive)); resolvedTab.setAttribute('aria-selected',String(!pendingActive)); pendingPanel.hidden=!pendingActive; resolvedPanel.hidden=pendingActive; }
      function openStar(id) { const star=stars.find((entry)=>entry.id===id && entry.status==='pending'); if (!star) return; dialogReturnFocus=document.activeElement; dialogReason.textContent=`这颗星星写着：${star.reason}`; starDialog.dataset.starId=star.id; solutionInput.value=''; if (historySheet.open) historySheet.close(); starDialog.showModal(); solutionInput.focus(); }
      function animateDeparture(star) { if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return; const source=bottleStars.querySelector(`[data-star-id="${star.id}"]`); if (!source) return; const bounds=source.getBoundingClientRect(); const departure=source.cloneNode(); departure.classList.add('star-departure'); departure.removeAttribute('data-star-id'); departure.setAttribute('aria-hidden','true'); departure.style.left=`${bounds.left}px`; departure.style.top=`${bounds.top}px`; document.body.append(departure); departure.addEventListener('animationend',()=>departure.remove(),{once:true}); window.setTimeout(()=>departure.remove(),700); }
      function resolveStar(id,solution) { const trimmedSolution=solution.trim(); if (!trimmedSolution) { announce('写下你是怎么解决的，再让这颗星星离开瓶子吧。'); return false; } const storedStars=loadStars(); const target=storedStars.find((star)=>star.id===id && star.status==='pending'); if (!target) return false; const nextStars=storedStars.map((star)=>star.id===id ? {...star,status:'resolved',solution:trimmedSolution,resolvedAt:new Date().toISOString()} : star); if (!saveStars(nextStars)) return false; animateDeparture(target); render(nextStars); starDialog.close(); announce('这颗星星已经带着你的回应，轻轻离开瓶子了。'); return true; }
      createButton.addEventListener('click',()=>{showSheet(createSheet,createButton); reasonInput.focus();}); historyButton.addEventListener('click',()=>{showSheet(historySheet,historyButton); setHistoryTab('pending');}); document.querySelectorAll('[data-close-sheet]').forEach((button)=>button.addEventListener('click',()=>closeSheet(document.querySelector(`#${button.dataset.closeSheet}`)))); pendingTab.addEventListener('click',()=>setHistoryTab('pending')); resolvedTab.addEventListener('click',()=>setHistoryTab('resolved'));
      form.addEventListener('submit',(event)=>{event.preventDefault(); const reason=reasonInput.value.trim(); if (!reason) { announce('请先写下让你生气的原因，再折成星星。'); reasonInput.focus(); return; } const selected=form.elements['star-color'].value; const nextStars=[...stars,createStar(reason,selected)]; if (saveStars(nextStars)) { render(nextStars); form.reset(); createSheet.close(); announce('这颗星星已经安静地放进瓶子里了。'); }});
      starDialog.querySelector('form').addEventListener('submit',(event)=>{event.preventDefault(); resolveStar(starDialog.dataset.starId,solutionInput.value);});
      [createSheet,historySheet,starDialog].forEach((sheet)=>sheet.addEventListener('close',()=>{const target=dialogReturnFocus; dialogReturnFocus=null; if (target && target.isConnected && !starDialog.open && !createSheet.open && !historySheet.open) target.focus();}));
      window.loadStars=loadStars; window.saveStars=saveStars; window.createStar=createStar; window.render=render; window.openStar=openStar; window.resolveStar=resolveStar; stars=loadStars(); render(stars);
    })();
  </script>
  <script>
    if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
      navigator.serviceWorker.register('./sw.js').catch(() => {});
    }
  </script>
